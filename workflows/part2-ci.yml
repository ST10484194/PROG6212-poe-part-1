name: Part 2 - API CI

on:
  push:
    branches: [ "part2-api", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show test project file
        run: cat RaceDay.Api/RaceDay.Tests/RaceDay.Tests.csproj

      - name: Restore dependencies
        run: dotnet restore RaceDay.Api/RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build API and tests
        run: dotnet build RaceDay.Api/RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Api/RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --verbosity normal
